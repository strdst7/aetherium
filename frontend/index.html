<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetherium Nexus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            aether: {
              900: '#050514',
              800: '#0a0a2a',
              700: '#121240',
              cyan: '#00f0ff',
              magenta: '#ff003c',
              purple: '#8a2be2'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'glow': 'glow 2s ease-in-out infinite alternate',
          },
          keyframes: {
            glow: {
              '0%': { boxShadow: '0 0 5px #00f0ff, 0 0 10px #00f0ff' },
              '100%': { boxShadow: '0 0 20px #00f0ff, 0 0 30px #00f0ff' }
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #050514;
      color: #e2e8f0;
      margin: 0;
      overflow: hidden;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(10, 10, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 240, 255, 0.6);
    }
  </style>
    <!-- Polyfill for process.env in case the environment doesn't inject it globally before imports -->
  <script>
    window.process = window.process || { env: {} };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
