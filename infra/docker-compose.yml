version: "3.8"
services:
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio-data:/data

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./api
    env_file: .env.local
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - minio
      - redis

  web:
    build: ./web
    env_file: .env.local
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  minio-data:
  mongo-data:
